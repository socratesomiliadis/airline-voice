[project]
name = "airline-api"
version = "0.1.0"
description = "FastAPI transport and infrastructure for the airline agent."
requires-python = ">=3.12"
dependencies = [
    "airline-contracts",
    "alembic>=1.15,<2",
    "asyncpg>=0.30,<1",
    "elevenlabs>=2,<3",
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.8,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[tool.uv.sources]
airline-contracts = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airline_api"]
