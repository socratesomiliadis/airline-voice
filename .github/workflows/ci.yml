name: Project checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: airline
          POSTGRES_PASSWORD: airline_test
          POSTGRES_DB: airline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U airline -d airline_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://airline:airline_test@localhost:5432/airline_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - run: uv run --all-packages ruff check .
      - run: uv run --all-packages ruff format --check .
      - run: uv run --all-packages mypy
      - run: uv run --all-packages python -m airline_refiner.verification
      - run: uv run --package airline-api alembic -c apps/api/alembic.ini heads
      - run: uv run --package airline-api airline-seed-flights --validate-only

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose --profile refinement build
