name: airline-voice

services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-airline}
      POSTGRES_USER: ${POSTGRES_USER:-airline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airline_local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AGENT_API_KEY: ${AGENT_API_KEY:-}
      KNOWLEDGE_DIR: /app/knowledge
      SIMULATION_NOW: ${SIMULATION_NOW:-}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-airline}:${POSTGRES_PASSWORD:-airline_local}@database:5432/${POSTGRES_DB:-airline}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}
      REFINER_ARTIFACTS_DIR: /app/artifacts
    volumes:
      - ./artifacts:/app/artifacts:ro
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  dashboard:
    build:
      context: apps/dashboard
    environment:
      API_BASE_URL: http://api:8000
      AGENT_API_KEY: ${AGENT_API_KEY:-}
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

  refiner:
    profiles: ["refinement"]
    build:
      context: .
      dockerfile: apps/refiner/Dockerfile
    environment:
      REFINER_API_BASE_URL: http://api:8000
      REFINER_ARTIFACTS_DIR: /app/artifacts
      REFINER_CONFIG_PATH: /app/config/refinement.example.toml
    volumes:
      - refinement_artifacts:/app/artifacts
      - ./config:/app/config:ro
      - ./prompts:/app/prompts:ro
      - ./scenarios:/app/scenarios:ro
    depends_on:
      api:
        condition: service_healthy
    # Package/CLI inspection only. Run the worker on the host for source edits and service reloads.
    command: ["--help"]

volumes:
  postgres_data:
  refinement_artifacts:
